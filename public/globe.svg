<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer circle (globe) -->
  <circle cx="32" cy="32" r="28" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
  <!-- Vertical center ellipse (longitude) -->
  <ellipse cx="32" cy="32" rx="12" ry="28" fill="none" stroke="#bae6fd" stroke-width="1.5"/>
  <!-- Horizontal center line (equator) -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#bae6fd" stroke-width="1.5"/>
  <!-- Upper latitude line -->
  <path d="M14 18 Q32 15 50 18" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
  <!-- Lower latitude line -->
  <path d="M14 46 Q32 49 50 46" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
  <!-- Subtle sheen overlay -->
  <ellipse cx="24" cy="20" rx="7" ry="5" fill="white" fill-opacity="0.15"/>
</svg>
